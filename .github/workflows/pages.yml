# The site, built and published by GitHub itself.
#
# Lives here rather than in .github/workflows because this directory is a
# corner of a private monorepo, and the site is published from its own public
# repository — `publish_repo.py` copies this file into place as
# .github/workflows/pages.yml. Nothing in the public repo is a secret: the
# payload it builds from is the same JSON the site ships to every reader.
#
# Two things this buys over pushing a built `dist`:
#   * the site is reproducible from the repository, so a bad deploy is a git
#     revert rather than an archaeology exercise;
#   * `dist` never enters git history. It is 7 000 files and a rebuild reprices
#     almost all of them, so committing it would add a few hundred megabytes a
#     year to a repository whose actual source is three megabytes.
name: pages

on:
  push:
    branches: [main]
  # Data changes without the code changing; this is how a refresh ships.
  workflow_dispatch:
    inputs:
      legacy_baseline_release:
        description: 'One-time strict observed-partial lifecycle baseline (no source date)'
        required: false
        type: boolean
        default: false
  # Rebuilds age availability from the committed snapshot only: no Caixa
  # fetch, database pull, or paid call runs in this workflow.
  schedule:
    - cron: '37 3 * * *'

# The default 10-builds-an-hour ceiling does not apply to a workflow that
# publishes with actions/deploy-pages, which is one of the reasons to use one.
permissions:
  # write: a failed build pushes its own log to the ci-debug branch, because
  # this repo's Actions logs are not readable anonymously and the operator
  # works over git.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # No fallback: production must fail closed when SITE_URL is absent or wrong.
      SITE_URL: ${{ vars.SITE_URL }}
      MAPS_EMBED_API_KEY: ${{ vars.MAPS_EMBED_API_KEY }}
      BRAZIL_PUBLIC_ANALYSIS_ENABLED: ${{ vars.BRAZIL_PUBLIC_ANALYSIS_ENABLED }}
      PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
      PUBLIC_OPERATOR_CONTACT: ${{ vars.PUBLIC_OPERATOR_CONTACT }}
      ANALYSIS_API_BASE: ${{ vars.ANALYSIS_API_BASE }}
      LOT_REPORTS_ENABLED: ${{ vars.LOT_REPORTS_ENABLED }}
      GA4_ID: ${{ vars.GA4_ID }}
      GA4_ENHANCED_MEASUREMENT_DISABLED: ${{ vars.GA4_ENHANCED_MEASUREMENT_DISABLED }}
      CF_BEACON: ${{ vars.CF_BEACON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install --disable-pip-version-check websockets numpy scipy pillow

      - name: Build the payload
        # A release must have a documented source date. Rebuilding an old
        # export is not a data refresh; missing metadata must stop publication.
        env:
          # proto_build calls public_config.snippet; keep every public build
          # switch in this step so push, schedule and manual runs share the
          # same production configuration. Values are never printed.
          MAPS_EMBED_API_KEY: ${{ vars.MAPS_EMBED_API_KEY }}
          BRAZIL_PUBLIC_ANALYSIS_ENABLED: ${{ vars.BRAZIL_PUBLIC_ANALYSIS_ENABLED }}
          LOT_REPORTS_ENABLED: ${{ vars.LOT_REPORTS_ENABLED }}
          GA4_ID: ${{ vars.GA4_ID }}
          GA4_ENHANCED_MEASUREMENT_DISABLED: ${{ vars.GA4_ENHANCED_MEASUREMENT_DISABLED }}
          CF_BEACON: ${{ vars.CF_BEACON }}
          ANALYSIS_API_BASE: ${{ vars.ANALYSIS_API_BASE }}
          PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
          PUBLIC_OPERATOR_CONTACT: ${{ vars.PUBLIC_OPERATOR_CONTACT }}
        run: |
          if [ "${{ inputs.legacy_baseline_release || 'false' }}" = "true" ]; then
            BUILD_MODE=--legacy-baseline-release
          else
            BUILD_MODE=--release
          fi
          python proto_build.py "$BUILD_MODE"
          printf '%s\n' "$BUILD_MODE" > .release-build-mode

      - name: Check release validator
        run: |
          python test/test_pages_workflow_contract.py
          python test/test_freshness.py
          python -m unittest discover -s release_tests -v
          python -m unittest discover -s test -p 'test_seo.py' -v
          python test/test_sitemap_freshness.py
          python test/test_asset_versioning.py
          node test/seo_app.mjs
          node test/archive_app.mjs
          node test/country_city_order.mjs
          node test/lifecycle_i18n.mjs
          node --test site/test/funnel.test.mjs
          node --test site/test/analytics.test.mjs
          node --test site/test/lot-reports.test.mjs
          node --test site/test/matricula-upload.test.mjs
          node --test site/test/matricula-e2e.test.mjs
          node --test site/test/geo.test.mjs
          node --test site/test/gallery.test.mjs
          node --test site/test/related-lots.test.mjs
          node --test site/test/lot-map.test.mjs
          node --test site/test/market.test.mjs

      # Chrome is preinstalled on ubuntu-latest; prerender drives it over CDP.
      - name: Serve and pre-render
        env:
          # Canonicals, OG URLs, sitemap and robots are production-only here.
          # The release gate accepts exactly https://precodemartelo.com.
          SITE: ${{ vars.SITE_URL }}
          # Measurement is a repository variable, not a commit. Unset means the
          # pages ship with no counter at all — which is what a fork, a local
          # checkout and a preview build should be. Set both under
          # Settings → Secrets and variables → Actions → Variables:
          #   GA4_ID     the "G-" measurement ID of a GA4 web data stream
          #   CF_BEACON  the token from Cloudflare → Web Analytics → the site
          # Neither is a secret: both ship inside every page by design.
          MAPS_EMBED_API_KEY: ${{ vars.MAPS_EMBED_API_KEY }}
          BRAZIL_PUBLIC_ANALYSIS_ENABLED: ${{ vars.BRAZIL_PUBLIC_ANALYSIS_ENABLED }}
          LOT_REPORTS_ENABLED: ${{ vars.LOT_REPORTS_ENABLED }}
          GA4_ID: ${{ vars.GA4_ID }}
          # Set true only after automatic form/history/outbound/search capture
          # is disabled in the GA4 web stream. We send explicit safe events.
          GA4_ENHANCED_MEASUREMENT_DISABLED: ${{ vars.GA4_ENHANCED_MEASUREMENT_DISABLED }}
          CF_BEACON: ${{ vars.CF_BEACON }}
          # Public notice/queue configuration. These values are visible to
          # readers, never API secrets or email-provider credentials.
          PUBLIC_OPERATOR_NAME: ${{ vars.PUBLIC_OPERATOR_NAME }}
          PUBLIC_OPERATOR_CONTACT: ${{ vars.PUBLIC_OPERATOR_CONTACT }}
          ANALYSIS_API_BASE: ${{ vars.ANALYSIS_API_BASE }}
        run: |
          set -o pipefail
          python -u serve.py --port 8899 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8899/v2/index.html && break
            sleep 0.5
          done
          python -u prerender.py "$(cat .release-build-mode)" --site "$SITE" 2>&1 | tee prerender.log
          python release_check.py --out dist --site "$SITE" --release

      # Failure forensics an anonymous reader can reach: the log rides a
      # throwaway orphan branch instead of the run's own (auth-only) log view.
      - name: Publish the failure log
        if: failure()
        run: |
          git config user.name ci
          git config user.email ci@localhost
          git checkout --orphan ci-debug
          git rm -rfq --cached . || true
          git add -f prerender.log || true
          git commit -q -m "prerender log, run $GITHUB_RUN_ID" || exit 0
          git push -f origin ci-debug

      # enablement: turns Pages on for the repo on first run, so the deploy
      # needs no manual visit to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      # No credential or callback is deliberately needed here. The private
      # Brazil worker polls the public manifest and verifies projection bytes
      # before it advances its local published lifecycle baseline.
      - run: echo "Lifecycle promotion is verified by the private worker over public HTTPS."
